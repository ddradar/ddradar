name: Node.js CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v2.1.0
        with: &pnpm-setup-with
          cache: true
          require-lockfile: true

      - parallel:
          - name: Run ESLint
            run: pnpm lint:eslint
          - name: Run Oxfmt
            run: pnpm lint:oxfmt
          - name: Run Oxlint
            run: pnpm lint:oxlint
          - name: Run vue-tsc (via Nuxt)
            run: pnpm lint:typecheck

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to use OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v2.1.0
        with: *pnpm-setup-with

      - name: Test
        run: pnpm test --coverage

      - name: Report Code Coverage to codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          use_oidc: true

  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging' }}
      url: ${{ vars.ENVIRONMENT == 'production' && 'https://ddradar.app' || steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v2.1.0
        with: *pnpm-setup-with

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ vars.ENVIRONMENT }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ vars.ENVIRONMENT == 'production' && 'deploy' || format('versions upload --tag pr-{0}', github.event.pull_request.number) }}
